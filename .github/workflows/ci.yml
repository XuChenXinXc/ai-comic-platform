name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装后端依赖
        run: pip install -e ".[dev]"
      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: ruff 静态检查
        run: ruff check app alembic tests
      - name: 后端单元测试
        run: pytest -q --ignore=tests/e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: 前端单元测试
        run: npm run test
      - name: 类型检查与构建
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装后端依赖
        run: pip install -e ".[dev]"
        working-directory: backend
      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend
      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: 端到端测试
        run: npm run test:e2e
        working-directory: frontend
        env:
          CI: "true"
          E2E_BACKEND_COMMAND: python -m uvicorn app.main:app --app-dir ../backend --host 127.0.0.1 --port 8012
