[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-comic-platform-backend"
version = "0.1.0"
description = "AI 漫剧本地平台后端"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.14,<2",
    "edge-tts>=7,<8",
    "fastapi>=0.115,<1",
    "pillow>=11,<12",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.20,<1",
    "requests>=2.32,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<0.35",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
